version: '3.8'

services:
  devcontainer:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    volumes:
      # Persist vscode user home directory
      - vscode-home:/home/vscode
      # Mount the workspace
      - ../..:/workspaces:cached
      - /tmp        # Anonymous volume
      # Mount mkcert CA root directory
      - ${MKCERT_PATH:-${HOME}/Library/Application Support/mkcert}:/caroot:ro,cached
    user: vscode
    command: sleep infinity
    init: true
    network_mode: host
    environment:
      - DOCKER_BUILDKIT=1
      - CAROOT=/caroot

volumes:
  # Named volume to persist vscode home directory
  vscode-home:
    driver: local