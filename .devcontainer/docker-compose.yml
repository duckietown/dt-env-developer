version: '3.8'

services:
  devcontainer:
    build: 
      context: .
      dockerfile: Dockerfile
    volumes:
      # Persist vscode user home directory
      - vscode-home:/home/vscode
      # Mount the workspace
      - ../..:/workspaces:cached
      - /tmp        # Anonymous volume

    command: sleep infinity
    init: true
    network_mode: host
    environment:
      - DOCKER_BUILDKIT=1

volumes:
  # Named volume to persist vscode home directory
  vscode-home:
    driver: local